<nav class="fixed top-0 left-0 right-0 z-50 transition-all duration-300"
     [ngClass]="isScrolled ? 'nav-scrolled' : 'nav-top'">
  <div style="max-width:1200px;margin:0 auto;padding:0 1.5rem;">
    <div class="flex items-center justify-between h-16">

      <!-- Logo -->
      <a href="#home" (click)="scrollTo('#home');$event.preventDefault()"
         style="font-family:'JetBrains Mono',monospace;font-size:1.05rem;font-weight:800;color:var(--orange);text-decoration:none;display:inline-flex;align-items:center;gap:0.55rem;letter-spacing:-0.02em;">
        <img src="assets/favicon.svg" alt="" width="28" height="28" style="display:block;border-radius:8px;">
        kishore.dev
      </a>

      <!-- Desktop links -->
      <div class="hidden md:flex items-center gap-1">
        <a *ngFor="let link of navLinks"
           href="{{ link.href }}"
           (click)="scrollTo(link.href);$event.preventDefault()"
           class="nav-link"
           [class.active]="activeSection === link.href"
           [attr.aria-current]="activeSection === link.href ? 'page' : null">{{ link.label }}</a>
      </div>

      <!-- Actions -->
      <div class="hidden md:flex items-center gap-3">
        <button (click)="toggleTheme()" class="theme-btn" aria-label="Toggle theme">
          <svg *ngIf="!isDark" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
          </svg>
          <svg *ngIf="isDark" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
          </svg>
        </button>
        <button (click)="openResume()" class="btn-primary" style="padding:0.5rem 1.25rem;font-size:0.825rem;">
          Resume ↗
        </button>
      </div>

      <!-- Mobile -->
      <div class="md:hidden flex items-center gap-2">
        <button (click)="toggleTheme()" class="theme-btn">
          <svg *ngIf="!isDark" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
          </svg>
          <svg *ngIf="isDark" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
          </svg>
        </button>
        <button (click)="toggleMobile()" class="theme-btn">
          <svg *ngIf="!isMobileMenuOpen" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
          <svg *ngIf="isMobileMenuOpen" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
    </div>

    <!-- Mobile menu -->
    <div *ngIf="isMobileMenuOpen" class="md:hidden mobile-menu py-4 border-t" style="border-color:var(--border-dark);">
      <a *ngFor="let link of navLinks"
         href="{{ link.href }}"
         (click)="scrollTo(link.href);$event.preventDefault()"
         class="mobile-link"
         [class.active]="activeSection === link.href"
         [attr.aria-current]="activeSection === link.href ? 'page' : null">{{ link.label }}</a>
      <button (click)="openResume()" class="btn-primary w-full mt-3">Resume ↗</button>
    </div>
  </div>
</nav>

<app-resume-modal *ngIf="isResumeOpen" (close)="closeResume()"></app-resume-modal>
